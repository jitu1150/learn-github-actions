name: Scheduled Demo
on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GREETING: ${{ vars.GREETING }}
      MY_SECRET: ${{ secrets.MY_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python show_env.py
