name: Setup Python environment
description: Install Python, restore the pip cache and install requirements.txt
inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - run: pip install -r requirements.txt
      shell: bash
